[pytest]
DJANGO_SETTINGS_MODULE = dj_ai_employee_main.test_settings
python_files = test_*.py
addopts =
    --strict-markers
    --cov=orders
    --cov=support
    --cov-report=term-missing
    --cov-report=html
    -v
markers =
    unit: Unit tests (isolated, fast)
    integration: Integration tests (DB, HTTP)
    smoke: Smoke tests (sanity checks)
    slow: Slow running tests (API calls)
